name: Hechos de importancia - 3x al dia

# NOTA: este workflow ya NO usa 'schedule' (cron de GitHub) porque GitHub no
# garantiza la hora de disparo de los cron y en la practica llegamos a ver
# retrasos de 3 a 11 horas (peor en horas "en punto" como 12:00/17:00/21:00
# UTC, que son las mas congestionadas). En su lugar, un servicio externo
# (cron-job.org) llama a la API de GitHub a la hora exacta para disparar
# workflow_dispatch con la franja correspondiente. Ver README.md para la
# configuracion de esos 3 disparadores externos.
on:
  workflow_dispatch:
    inputs:
      franja:
        description: "Franja a correr (vacio = usa LOOKBACK_DIAS de config.py en vez de una franja horaria)"
        type: choice
        default: ""
        options: ["", "manana", "mediodia", "tarde"]

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Correr pipeline
        env:
          FRANJA: ${{ inputs.franja }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py
