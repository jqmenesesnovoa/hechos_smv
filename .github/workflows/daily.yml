name: Hechos de importancia - 3x al dia

on:
  schedule:
    # Los 3 horarios son de lunes a viernes, en hora de Lima (UTC-5, sin horario de verano):
    - cron: "0 12 * * 1-5"  # 07:00 Lima -> manana:   hechos entre 16:01 de ayer y 07:00 de hoy
    - cron: "0 17 * * 1-5"  # 12:00 Lima -> mediodia: hechos entre 07:01 y 12:00 de hoy
    - cron: "0 21 * * 1-5"  # 16:00 Lima -> tarde:    hechos entre 12:01 y 16:00 de hoy
  workflow_dispatch:
    inputs:
      franja:
        description: "Franja a correr manualmente (vacio = usa LOOKBACK_DIAS de config.py en vez de una franja horaria)"
        type: choice
        default: ""
        options: ["", "manana", "mediodia", "tarde"]

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Determinar franja segun el cron que disparo el job
        id: franja
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * 1-5") echo "valor=manana" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * 1-5") echo "valor=mediodia" >> "$GITHUB_OUTPUT" ;;
            "0 21 * * 1-5") echo "valor=tarde" >> "$GITHUB_OUTPUT" ;;
            *) echo "valor=${{ inputs.franja }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Correr pipeline
        env:
          FRANJA: ${{ steps.franja.outputs.valor }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py
